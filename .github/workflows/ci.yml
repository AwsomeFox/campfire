name: CI

on:
  push:
    branches: [main]
    # Doc-only / non-code changes don't need the full build + test + browser
    # matrix. Anything under these paths (and nothing else) short-circuits CI.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build once for jobs that consume shared dist (build-test-24, server-tests,
  # e2e-web, and pwa-web).
  # Installs deps (cached) and builds every workspace's dist a single time,
  # then publishes schema/server/web dist as an artifact. Unit coverage is
  # independent because ts-jest instruments source and does not consume dist.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          # ABI-sensitive native deps (better-sqlite3, sharp) — key on Node
          # major, architecture, runner OS/image version, and lockfile.
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build (schema + server + web)
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/schema/dist
            apps/server/dist
            apps/web/dist
          if-no-files-found: error
          retention-days: 1

  # Lint + typecheck + version-sync gate. Independent of `build` so it fails
  # fast. `npm run typecheck` builds schema then runs `tsc --noEmit` everywhere.
  #
  # Issue #1535: "everywhere" used to mean shipped sources only — the server's
  # `test/` tree and the web Playwright tree were type-checked by nothing this
  # aggregate gate required. A test-only compile error (typically a service
  # constructor gaining or reordering a parameter while hand-constructed specs
  # kept the old call) therefore slipped past `lint` and surfaced ~20 min later
  # in `coverage` as "N suites failed, 0 tests failed", which reads like a
  # coverage-threshold miss. Both trees are now inside `npm run typecheck`, so
  # the script means the same thing locally and here:
  #   - apps/server typecheck now uses tsconfig.jest.json (src + test, with
  #     @campfire/schema mapped to source) instead of tsconfig.json (src only).
  #     Not an extra pass: the file set is a superset, and the src-only/dist-
  #     resolution combination it replaces is exactly what `nest build` does in
  #     the `build` and `build-test-22` jobs. `--rootDir ../..` is required
  #     because tsconfig.json pins rootDir to `src`, which the mapped schema
  #     sources and `test/` both sit outside of (TS6059).
  #   - apps/web typecheck now chains `test:e2e:typecheck`. That step also runs
  #     in `e2e-web`/`pwa-web`, but neither is in the `ci` aggregate's needs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      # Issue #432: every version surface (workspace package.json, docs, and the
      # historically-hardcoded auth/MCP/OpenAPI leftovers) must agree.
      - run: npm run check:version
      - run: npm run check:mcp-catalog
      - run: npm run check:i18n
      - run: npm run build -w packages/schema
      - run: npm run check:e2e-spec-coverage
      - run: npm run lint
      - run: npm run typecheck

  # Node 22 (older supported LTS) compatibility gate. Rebuilds schema + server +
  # web on 22.x to catch version-specific compile/build breaks. Server tests run
  # on 24.x in the unit-only `coverage` job and sharded `server-tests` job, so
  # they are intentionally NOT duplicated here.
  build-test-22:
    name: build-test (22.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-22x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Compatibility build (schema + server + web)
        run: npm run build
      # Issue #569: `test:pwa` is exactly `vite-build-strict.mjs &&
      # check-pwa-dist.mjs`. CI runs those two halves as separate steps so the
      # web build is never repeated — the strict build is the step above, and
      # this is the dist contract checked against it. Running it here means the
      # 22.x build output (previously produced and thrown away unchecked) has to
      # satisfy the same manifest / service worker / icon contract as 24.x, and
      # it does so inside the required gate with no browser and so no flake.
      - run: npm run test:pwa:dist -w apps/web

  # Node 24 build-output gate: validates the PWA dist contract (manifest,
  # service worker, icons) against the shared web build produced by `build`,
  # without rebuilding. Together with the `build` job's strict web build this is
  # the second half of `test:pwa` on 24.x (see build-test-22 for the split).
  build-test-24:
    name: build-test (24.x)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      # Contract check runs against the downloaded apps/web/dist (no rebuild).
      - run: npm run test:pwa:dist -w apps/web

  # Unit-only server coverage. It starts immediately and instruments every
  # production source file, but executes only test/unit/**/*.spec.ts. Integration
  # and server e2e suites run without instrumentation in `server-tests`.
  coverage:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      # Jest's default cache lives under /tmp and disappears with the runner.
      # Use a rolling key: restore the newest compatible transform cache, then
      # save this commit's updated entries without relying on mutable caches.
      - name: Cache Jest unit transforms
        uses: actions/cache@v4
        with:
          path: apps/server/.cache/jest/unit
          key: jest-unit-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json', 'apps/server/jest*.config.js', 'apps/server/tsconfig.jest.json') }}-${{ github.sha }}
          restore-keys: |
            jest-unit-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json', 'apps/server/jest*.config.js', 'apps/server/tsconfig.jest.json') }}-
      - run: npm run build -w packages/schema
      - run: npm run test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: apps/server/coverage/
          if-no-files-found: warn

  # Server integration + e2e specs, without coverage instrumentation. These
  # tests consume the shared server dist (notably OIDC, which launches
  # dist/main.js) and are sharded to keep the required CI path inside the 5-10
  # minute target. Timing-sensitive `*.perf.spec.ts` benchmarks run in
  # server-performance.yml instead, so shared-runner variance cannot block an
  # unrelated PR.
  server-tests:
    name: server-tests (${{ matrix.shard }}/4)
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      # Each shard gets its own cache path/key so four concurrent jobs can save
      # useful transforms instead of racing on one immutable Actions cache.
      - name: Cache Jest server transforms
        uses: actions/cache@v4
        with:
          path: apps/server/.cache/jest/server-${{ matrix.shard }}
          key: jest-server-${{ matrix.shard }}-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json', 'apps/server/jest.config.js', 'apps/server/tsconfig.jest.json') }}-${{ github.sha }}
          restore-keys: |
            jest-server-${{ matrix.shard }}-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json', 'apps/server/jest.config.js', 'apps/server/tsconfig.jest.json') }}-
      - name: Run server tests (shard ${{ matrix.shard }}/4)
        env:
          JEST_CACHE_DIR: ${{ github.workspace }}/apps/server/.cache/jest/server-${{ matrix.shard }}
        run: npm run test:server:ci -w apps/server -- --shard=${{ matrix.shard }}/4

  # Web unit tier (issue #1574): apps/web/e2e/tests/*.unit.spec.ts — 157 pure-logic specs
  # that the default Playwright config `testIgnore`s and that, until now, NO npm script and
  # NO workflow ran. They compiled (post-#1535 `npm run typecheck` covers the web e2e tree)
  # and so stayed green-looking, while nothing ever executed an assertion. Turning them on
  # surfaced 10 real failures, including four components referencing undefined CSS custom
  # properties without a fallback — the exact class of bug this tier was written to catch.
  #
  # Runs the Playwright RUNNER with no browser: every spec here is Node-importable logic or
  # a source assertion (no `page`/`browser` fixture anywhere in the tier), so there is no
  # `playwright install` step and no navigation or service-worker timing to race. That is
  # why this one CAN sit in the required `ci` gate where e2e-web and pwa-web deliberately
  # do not — it is browserless, and so has no flake surface.
  #
  # Only packages/schema/dist is needed (36 specs import @campfire/schema), so it builds
  # that directly rather than waiting for the full shared build. The job starts
  # immediately and finishes in roughly two minutes.
  unit-web:
    name: unit-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build schema dependency
        run: npm run build -w packages/schema
      - name: Run web unit specs
        run: npm run test:unit -w apps/web

  # Browser E2E (Playwright). Consumes the shared schema + server + web dist and
  # runs the suite against the real built server serving the built SPA on one
  # origin (see apps/web/e2e/server.mjs). Uses `test:e2e:nobuild` so it does NOT
  # rebuild — the previous job rebuilt schema explicitly AND again inside the
  # `test:e2e` script (a double build in one job).
  e2e-web:
    name: e2e-web (${{ matrix.shard }}/4)
    needs: build
    # Browser-system setup can be delayed by an apt mirror. Keep that failure
    # separate from the fixed test budget below so it cannot cancel a shard
    # before Playwright selects a spec.
    # 30 minutes reserves eight minutes for checkout, cache, artifact, and
    # typecheck overhead in addition to the explicit 12 + 10 minute caps.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      # Type-check Playwright sources before running the suite.
      - run: npm run test:e2e:typecheck -w apps/web
      # Cache the Chromium download; key on the lockfile (pins @playwright/test).
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      # Always run install so the OS deps (--with-deps) are present; on a browser
      # cache hit the Chromium binary download itself is skipped.
      - name: Install Playwright Chromium and system dependencies
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        timeout-minutes: 10
        working-directory: apps/web
        run: |
          if [ "${{ matrix.shard }}" = "1" ]; then npx playwright test --config playwright.first-run.config.ts; fi
          npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 1

  # Runtime PWA gate (issue #569). `build-test-*` proves the built FILES satisfy
  # the PWA contract; this proves a real Chromium actually registers the worker
  # we ship, precaches the shell, serves it with the network cut, and offers the
  # install CTA — the install/offline promise the dist check cannot make.
  #
  # Why a dedicated job rather than relying on the e2e-web shard that also picks
  # this spec up: main currently fails dozens of unrelated Playwright tests, so a
  # PWA regression buried in an already-red shard is invisible. A named check
  # makes it legible on the PR, and keeps it independently promotable to the
  # required set once it has a stability record.
  #
  # Why NOT in the required `ci` gate yet: it is a browser test that waits on
  # service-worker activation, and the required check blocks every PR in the
  # repo. It runs alongside e2e-web for signal; the zero-flake half of `test:pwa`
  # (the dist contract) is what sits in the required gate today.
  pwa-web:
    name: pwa-web
    needs: build
    # Match e2e-web: apt-backed browser setup has its own explicit timeout and
    # cannot spend the runtime PWA suite's test budget.
    # 30 minutes reserves eight minutes for checkout, cache, artifact, and
    # typecheck overhead in addition to the explicit 12 + 10 minute caps.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      - run: npm run test:e2e:typecheck -w apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium and system dependencies
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      # The service worker only exists against the REAL built SPA served by the
      # REAL server on one origin, so this reuses the primary project's seeded
      # webServer (apps/web/e2e/server.mjs) and runs just the PWA spec.
      - name: Run PWA install + offline suite
        timeout-minutes: 10
        run: npm run test:pwa:e2e -w apps/web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  # Aggregate CI signal. Keep `if: always()` so a failed, skipped, or cancelled
  # dependency still produces an explicit verdict. Browser jobs are included so
  # `ci: success` means the whole workflow passed, not just the fast required
  # subset. A cancelled-only run remains red but gets a useful explanation; it
  # must not silently turn green through GitHub's skipped-job semantics.
  ci:
    name: ci
    if: always()
    needs:
      [
        lint,
        build,
        build-test-22,
        build-test-24,
        coverage,
        server-tests,
        unit-web,
        e2e-web,
        pwa-web,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI jobs
        run: |
          jobs=(
            "lint:${{ needs.lint.result }}"
            "build:${{ needs.build.result }}"
            "build-test-22:${{ needs.build-test-22.result }}"
            "build-test-24:${{ needs.build-test-24.result }}"
            "coverage:${{ needs.coverage.result }}"
            "server-tests:${{ needs.server-tests.result }}"
            "unit-web:${{ needs.unit-web.result }}"
            "e2e-web:${{ needs.e2e-web.result }}"
            "pwa-web:${{ needs.pwa-web.result }}"
          )

          failed=()
          incomplete=()
          for job in "${jobs[@]}"; do
            name="${job%%:*}"
            result="${job#*:}"
            echo "${name}=${result}"
            if [ "$result" = "failure" ]; then
              failed+=("$name")
            elif [ "$result" != "success" ]; then
              incomplete+=("${name}:${result}")
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            {
              echo "### CI failed"
              echo
              echo "Failed job(s): ${failed[*]}"
              if [ "${#incomplete[@]}" -gt 0 ]; then
                echo
                echo "Also incomplete: ${incomplete[*]}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${#incomplete[@]}" -gt 0 ]; then
            {
              echo "### CI incomplete"
              echo
              echo "No dependency explicitly failed, but these jobs did not finish successfully:"
              echo
              echo "${incomplete[*]}"
              echo
              echo "This usually means a newer push cancelled this run. Confirm that this run's"
              echo "commit is still the PR head before investigating it as a regression."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All CI jobs passed." >> "$GITHUB_STEP_SUMMARY"
