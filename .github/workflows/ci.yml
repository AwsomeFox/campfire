name: CI

on:
  push:
    branches: [main]
    # Doc-only / non-code changes don't need the full build + test + browser
    # matrix. Anything under these paths (and nothing else) short-circuits CI.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build once for jobs that consume shared dist (build-test-24, e2e-web).
  # Installs deps (cached) and builds every workspace's dist a single time,
  # then publishes schema/server/web dist as an artifact. The coverage job is
  # independent: it starts immediately and builds only packages/schema itself.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          # ABI-sensitive native deps (better-sqlite3, sharp) — key on Node
          # major, architecture, runner OS/image version, and lockfile.
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build (schema + server + web)
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/schema/dist
            apps/server/dist
            apps/web/dist
          if-no-files-found: error
          retention-days: 1

  # Lint + typecheck + version-sync gate. Independent of `build` so it fails
  # fast. `npm run typecheck` builds schema then runs `tsc --noEmit` everywhere.
  #
  # Issue #1535: "everywhere" used to mean shipped sources only — the server's
  # `test/` tree and the web Playwright tree were type-checked by nothing this
  # aggregate gate required. A test-only compile error (typically a service
  # constructor gaining or reordering a parameter while hand-constructed specs
  # kept the old call) therefore slipped past `lint` and surfaced ~20 min later
  # in `coverage` as "N suites failed, 0 tests failed", which reads like a
  # coverage-threshold miss. Both trees are now inside `npm run typecheck`, so
  # the script means the same thing locally and here:
  #   - apps/server typecheck now uses tsconfig.jest.json (src + test, with
  #     @campfire/schema mapped to source) instead of tsconfig.json (src only).
  #     Not an extra pass: the file set is a superset, and the src-only/dist-
  #     resolution combination it replaces is exactly what `nest build` does in
  #     the `build` and `build-test-22` jobs. `--rootDir ../..` is required
  #     because tsconfig.json pins rootDir to `src`, which the mapped schema
  #     sources and `test/` both sit outside of (TS6059).
  #   - apps/web typecheck now chains `test:e2e:typecheck`. That step also runs
  #     in `e2e-web`/`pwa-web`, but neither is in the `ci` aggregate's needs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      # Issue #432: every version surface (workspace package.json, docs, and the
      # historically-hardcoded auth/MCP/OpenAPI leftovers) must agree.
      - run: npm run check:version
      - run: npm run check:mcp-catalog
      - run: npm run check:i18n
      - run: npm run lint
      - run: npm run typecheck

  # Node 22 (older supported LTS) compatibility gate. Rebuilds schema + server +
  # web on 22.x to catch version-specific compile/build breaks. The full server
  # suite is exercised once, with coverage, in the `coverage` job on 24.x — so it
  # is intentionally NOT re-run here (previously it ran on both 22.x and 24.x AND
  # again under coverage: three times for the same suite).
  build-test-22:
    name: build-test (22.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-22x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Compatibility build (schema + server + web)
        run: npm run build
      # Issue #569: `test:pwa` is exactly `vite-build-strict.mjs &&
      # check-pwa-dist.mjs`. CI runs those two halves as separate steps so the
      # web build is never repeated — the strict build is the step above, and
      # this is the dist contract checked against it. Running it here means the
      # 22.x build output (previously produced and thrown away unchecked) has to
      # satisfy the same manifest / service worker / icon contract as 24.x, and
      # it does so inside the required gate with no browser and so no flake.
      - run: npm run test:pwa:dist -w apps/web

  # Node 24 build-output gate: validates the PWA dist contract (manifest,
  # service worker, icons) against the shared web build produced by `build`,
  # without rebuilding. Together with the `build` job's strict web build this is
  # the second half of `test:pwa` on 24.x (see build-test-22 for the split).
  build-test-24:
    name: build-test (24.x)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      # Contract check runs against the downloaded apps/web/dist (no rebuild).
      - run: npm run test:pwa:dist -w apps/web

  # Authoritative server test gate: the full unit (test/unit/*.spec.ts) + e2e
  # (test/*.e2e-spec.ts) suite, run exactly once, with coverage instrumentation.
  # Starts immediately (no `needs: build`) so coverage can overlap the build
  # job. `test:cov` runs `nest build` internally and only needs schema dist
  # first — built locally in this job rather than downloaded from `build`.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build schema dependency
        run: npm run build -w packages/schema
      - run: npm run test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: apps/server/coverage/
          if-no-files-found: warn

  # Web unit tier (issue #1574): apps/web/e2e/tests/*.unit.spec.ts — 157 pure-logic specs
  # that the default Playwright config `testIgnore`s and that, until now, NO npm script and
  # NO workflow ran. They compiled (post-#1535 `npm run typecheck` covers the web e2e tree)
  # and so stayed green-looking, while nothing ever executed an assertion. Turning them on
  # surfaced 10 real failures, including four components referencing undefined CSS custom
  # properties without a fallback — the exact class of bug this tier was written to catch.
  #
  # Runs the Playwright RUNNER with no browser: every spec here is Node-importable logic or
  # a source assertion (no `page`/`browser` fixture anywhere in the tier), so there is no
  # `playwright install` step and no navigation or service-worker timing to race. That is
  # why this one CAN sit in the required `ci` gate where e2e-web and pwa-web deliberately
  # do not — it is browserless, and so has no flake surface.
  #
  # Only packages/schema/dist is needed (36 specs import @campfire/schema), so it builds
  # that directly rather than `needs: build`, matching `coverage`: the job starts
  # immediately and finishes in roughly two minutes.
  unit-web:
    name: unit-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build schema dependency
        run: npm run build -w packages/schema
      - name: Run web unit specs
        run: npm run test:unit -w apps/web

  # Browser E2E (Playwright). Consumes the shared schema + server + web dist and
  # runs the suite against the real built server serving the built SPA on one
  # origin (see apps/web/e2e/server.mjs). Uses `test:e2e:nobuild` so it does NOT
  # rebuild — the previous job rebuilt schema explicitly AND again inside the
  # `test:e2e` script (a double build in one job).
  e2e-web:
    name: e2e-web (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      # Type-check Playwright sources before running the suite.
      - run: npm run test:e2e:typecheck -w apps/web
      # Cache the Chromium download; key on the lockfile (pins @playwright/test).
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      # Always run install so the OS deps (--with-deps) are present; on a browser
      # cache hit the Chromium binary download itself is skipped.
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
        working-directory: apps/web
        run: |
          if [ "${{ matrix.shard }}" = "1" ]; then npx playwright test --config playwright.first-run.config.ts; fi
          npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  # Runtime PWA gate (issue #569). `build-test-*` proves the built FILES satisfy
  # the PWA contract; this proves a real Chromium actually registers the worker
  # we ship, precaches the shell, serves it with the network cut, and offers the
  # install CTA — the install/offline promise the dist check cannot make.
  #
  # Why a dedicated job rather than relying on the e2e-web shard that also picks
  # this spec up: main currently fails dozens of unrelated Playwright tests, so a
  # PWA regression buried in an already-red shard is invisible. A named check
  # makes it legible on the PR, and keeps it independently promotable to the
  # required set once it has a stability record.
  #
  # Issue #1594: this job (and the four e2e-web shards) used to be excluded from
  # the `ci` aggregate on the theory that a browser check waiting on
  # service-worker activation shouldn't block every PR. That left a standing
  # trap instead: `ci: success` could sit next to `e2e-web (1/4): failure` (see
  # #1547), and anyone reading `ci` as "CI passed" was reading it wrong. Both
  # are already required checks in their own right, so folding them into `ci`
  # adds no new gating — it only makes the aggregate's name true. See the `ci`
  # job below for the tradeoff this reintroduces (more slow jobs => more
  # superseded-push noise) and why that's an acceptable, non-gating cost.
  pwa-web:
    name: pwa-web
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Restore node_modules
        id: modcache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-24x-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .
      - run: npm run test:e2e:typecheck -w apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # The service worker only exists against the REAL built SPA served by the
      # REAL server on one origin, so this reuses the primary project's seeded
      # webServer (apps/web/e2e/server.mjs) and runs just the PWA spec.
      - name: Run PWA install + offline suite
        run: npm run test:pwa:e2e -w apps/web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  # Aggregate required status check for the branch ruleset (context name: "ci",
  # required by ruleset 19205904 — do NOT rename this job; renaming it silently
  # makes that ruleset requirement unsatisfiable). Since #1594's investigation,
  # `ci` now genuinely aggregates every required gate, including the four
  # e2e-web shards and pwa-web (previously excluded — see #1547 for the
  # `ci: success` next to `e2e-web (1/4): failure` trap that left). All eight
  # dependencies below are already required checks individually, so this adds
  # no new gating; it only makes the aggregate's name honest.
  #
  # Issue #1594 — what a `cancelled` dependency means here, backed by evidence:
  #
  # `coverage` (and now e2e-web/pwa-web) can take 20-40 minutes, and the
  # workflow's concurrency group cancels the in-flight run on every new push to
  # the same ref. That produces a `ci: failure` on the SUPERSEDED sha whenever a
  # PR gets a review-fix push mid-run — which reads exactly like a real
  # regression and trains readers to assume any red `ci` is spurious, which is
  # the habit that lets a genuine failure sit unexamined.
  #
  # The premise that this failure actually blocks merging was checked directly
  # against the API, not assumed:
  #   - Run 30374145136 (PR #1689, sha 91dcb176f9): `coverage` came back
  #     `cancelled` while every other job (build, lint, both build-test shards,
  #     unit-web, all 4 e2e-web shards, pwa-web) had already completed
  #     `success`. `ci` (if: always()) still ran, asserted `coverage == success`,
  #     and failed — reproducing the issue exactly.
  #   - That sha was already superseded: `gh pr view 1689` on the PR's actual
  #     head showed `ci: SUCCESS` and `coverage: SUCCESS` in
  #     `statusCheckRollup`, with `mergeStateStatus: BLOCKED` from a missing
  #     review, not from checks. GitHub's required-check rollup is keyed to the
  #     head sha; a check run on an abandoned sha is structurally invisible to
  #     it. So the red `ci` here never gated anything — it's a display/legibility
  #     problem, not a merge-safety one.
  #
  # That ruled out "fix" attempts that change whether `ci` runs at all. Run
  # 30378726387 (sha 5ea218310e) is the proof: when `build` failed, its
  # dependents `build-test-24`, `e2e-web`, and `pwa-web` — all on the default
  # implicit `if: success()` — came back `skipped`, not `cancelled`. Per
  # GitHub's own docs, `skipped` (like `neutral`) counts as a PASSING status for
  # required checks — it does not block merging. So making `ci` itself skip on
  # a cancelled dependency (e.g. `if: ${{ !cancelled() }}`, or excluding
  # `coverage`'s result from the `if:`) would silently turn today's honest-but-
  # confusing red into a GREEN required check while coverage was never actually
  # verified. That is strictly worse than the bug. Do not "fix" this by making
  # the job skip — re-derive from runs 30374145136 / 30378726387 above rather
  # than re-deriving from first principles if this comes up again.
  #
  # The fix actually shipped: keep `if: always()` and keep failing on any real
  # `failure` (a mixed cancelled+failure state stays an ordinary loud red — see
  # below). The only change is that a *cancelled-only, no-failure* state still
  # fails (so the required check stays un-green — right call under GitHub's
  # skip-passes semantics) but writes a self-explaining summary so a reader
  # doesn't have to re-derive the diagnosis via `git log origin/<branch>`.
  ci:
    name: ci
    if: always()
    needs:
      [
        lint,
        build,
        build-test-22,
        build-test-24,
        coverage,
        unit-web,
        e2e-web,
        pwa-web,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required gates
        run: |
          # Plain "name:result" pairs, not an associative array — keeps this
          # portable across bash versions and gives deterministic ordering.
          GATES=(
            "lint:${{ needs.lint.result }}"
            "build:${{ needs.build.result }}"
            "build-test-22:${{ needs.build-test-22.result }}"
            "build-test-24:${{ needs.build-test-24.result }}"
            "coverage:${{ needs.coverage.result }}"
            "unit-web:${{ needs.unit-web.result }}"
            "e2e-web:${{ needs.e2e-web.result }}"
            "pwa-web:${{ needs.pwa-web.result }}"
          )

          failed=()
          non_success=()
          for gate in "${GATES[@]}"; do
            name="${gate%%:*}"
            result="${gate#*:}"
            echo "${name}=${result}"
            if [ "$result" = "failure" ]; then
              failed+=("$name")
            elif [ "$result" != "success" ]; then
              # cancelled (or, in principle, skipped) — not a pass, not a failure.
              non_success+=("${name}:${result}")
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            {
              echo "### ci: FAILED"
              echo
              echo "Required gate(s) reported an explicit failure: ${failed[*]}"
              if [ "${#non_success[@]}" -gt 0 ]; then
                echo
                echo "Also non-success (not failed, not passed): ${non_success[*]}"
              fi
            } >>"$GITHUB_STEP_SUMMARY"
            echo "Required gate(s) failed: ${failed[*]}" >&2
            exit 1
          fi

          if [ "${#non_success[@]}" -gt 0 ]; then
            {
              echo "### ci: red, but likely superseded — probably not a merge blocker"
              echo
              echo "No dependency reported an explicit failure, but these did not"
              echo "reach success: ${non_success[*]}"
              echo
              echo "The most common cause: a newer push to this ref cancelled an"
              echo "in-flight run (the workflow's concurrency group cancels on every"
              echo "push). GitHub evaluates required status checks against the PR's"
              echo "CURRENT head sha only — a check run attached to a superseded sha"
              echo "is invisible to the merge button and to statusCheckRollup."
              echo
              echo "Before treating this as a regression: check whether this run's"
              echo "sha is still the PR's head (\`gh pr view <n> --json headRefOid\`)."
              echo "If it is not, this failure does not block merge — the newer"
              echo "push's own \`ci\` run is the one that matters."
              echo
              echo "This job intentionally still reports failure here (not skipped):"
              echo "GitHub treats a skipped required check as a PASS, which would be"
              echo "worse than this confusing-but-honest red. See issue #1594 for the"
              echo "evidence (runs 30374145136 and 30378726387)."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All required gates passed." >>"$GITHUB_STEP_SUMMARY"
