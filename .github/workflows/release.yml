name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-container:
    name: Build and push container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/campfire" >> "$GITHUB_OUTPUT"

      - name: Stamp workspace package.json versions for the release tag
        run: |
          version="${{ steps.meta.outputs.version }}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json","apps/server/package.json","apps/web/package.json","packages/schema/package.json"]) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.version = v;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            }
            const docs = "website/docs/index.md";
            const md = fs.readFileSync(docs, "utf8");
            const next = md.replace(/current release is \*\*v[^*]+\*\*/, `current release is **v${v}**`);
            if (next === md) throw new Error("docs version marker missing");
            fs.writeFileSync(docs, next);
          ' "$version"
          node scripts/check-version-sync.mjs

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ steps.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Build release changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"

          # Find the previous release tag for the changelog range
          PREV_TAG=$(gh release list --limit 10 --json tagName,isPrerelease,isDraft \
            -q "[.[] | select(.tagName != \"${RELEASE_TAG}\" and .isPrerelease == false and .isDraft == false)] | .[0].tagName // empty")

          # Build the raw changelog body
          NOTES="## What's Changed"$'\n\n'

          if [ -n "$PREV_TAG" ]; then
            # Use GitHub's auto-generated notes API for a nice PR-based changelog
            API_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$RELEASE_TAG" \
              -f previous_tag_name="$PREV_TAG" \
              -q .body 2>/dev/null || true)

            if [ -n "$API_NOTES" ]; then
              NOTES="$API_NOTES"
            else
              # Fallback: simple commit log
              NOTES="${NOTES}$(git log "${PREV_TAG}..${RELEASE_TAG}" --pretty=format:'* %s (%h)' --no-merges)"$'\n'
            fi
          else
            NOTES="${NOTES}This is the first release."$'\n'
          fi

          printf '%s' "$NOTES" > "$RUNNER_TEMP/release-changelog.md"

          {
            echo '## Container image'
            echo ''
            echo '```'
            echo "docker pull ${IMAGE}"
            echo '```'
          } > "$RUNNER_TEMP/release-container.md"

          # Publish baseline release notes immediately so a later AI-step failure
          # does not leave the release with stale/empty notes.
          {
            echo '### Full Changelog'
            echo ''
            printf '%s' "$NOTES"
            echo ''
            echo '---'
            echo ''
            cat "$RUNNER_TEMP/release-container.md"
          } > "$RUNNER_TEMP/release-baseline.md"

          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-baseline.md"
          echo "✅ Updated release ${RELEASE_TAG} with baseline changelog and image link"

      # When OPENROUTER_API_KEY is set, raw release notes are sent to OpenRouter
      # (a third-party service) for summarization.
      - name: Generate AI summary and update release
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: anthropic/claude-3.5-haiku
        with:
          script: |
            const fs = require('fs');

            const changelogPath = `${process.env.RUNNER_TEMP}/release-changelog.md`;
            const containerPath = `${process.env.RUNNER_TEMP}/release-container.md`;
            const releaseTag = process.env.GITHUB_REF_NAME;

            function readTempFile(path, label) {
              try {
                if (!fs.existsSync(path)) {
                  throw new Error(`missing ${label} at ${path}`);
                }
                return fs.readFileSync(path, 'utf8');
              } catch (error) {
                throw new Error(`Could not read ${label}: ${error.message}`);
              }
            }

            async function getReleaseWithRetry(tag, attempts = 3) {
              let lastError;
              for (let attempt = 0; attempt < attempts; attempt++) {
                try {
                  return await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag,
                  });
                } catch (error) {
                  lastError = error;
                  if (attempt < attempts - 1) {
                    await new Promise((resolve) => setTimeout(resolve, 2000 * (attempt + 1)));
                  }
                }
              }
              throw lastError;
            }

            async function fetchOpenRouterSummary(rawBody, apiKey, model) {
              const maxChangelogChars = 12000;
              const changelogForPrompt =
                rawBody.length > maxChangelogChars
                  ? `${rawBody.slice(0, maxChangelogChars)}\n\n[... changelog truncated for summarization ...]`
                  : rawBody;

              const prompt = `You are a technical product manager. Summarize these raw GitHub release notes into 3 clear sections:
            - 🚀 **Key Highlights**
            - ✨ **New Features & Improvements**
            - 🐛 **Bug Fixes & Maintenance**

            Keep it concise and clear. Here are the raw notes:
            ${changelogForPrompt}`;

              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 120000);

              try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                  method: 'POST',
                  signal: controller.signal,
                  headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': `https://github.com/${context.repo.owner}/${context.repo.repo}`,
                    'X-Title': 'Campfire Release Summarizer',
                  },
                  body: JSON.stringify({
                    model,
                    messages: [{ role: 'user', content: prompt }],
                    max_tokens: 1024,
                  }),
                });

                const responseText = await response.text();
                let data;
                try {
                  data = JSON.parse(responseText);
                } catch {
                  throw new Error(`Invalid JSON from OpenRouter (HTTP ${response.status})`);
                }

                if (!response.ok) {
                  const detail = data?.error?.message || responseText;
                  throw new Error(`OpenRouter HTTP ${response.status}: ${detail}`);
                }
                if (data.error) {
                  throw new Error(`OpenRouter error: ${data.error.message || JSON.stringify(data.error)}`);
                }

                const content = data.choices?.[0]?.message?.content?.trim();
                if (!content) {
                  throw new Error(`OpenRouter returned no summary: ${JSON.stringify(data)}`);
                }

                return content;
              } finally {
                clearTimeout(timeout);
              }
            }

            try {
              const rawBody = readTempFile(changelogPath, 'changelog');
              const containerSection = readTempFile(containerPath, 'container section').trim();
              const release = await getReleaseWithRetry(releaseTag);

              let summaryPrefix = '';

              if (process.env.OPENROUTER_API_KEY) {
                try {
                  const summary = await fetchOpenRouterSummary(
                    rawBody,
                    process.env.OPENROUTER_API_KEY,
                    process.env.OPENROUTER_MODEL,
                  );
                  summaryPrefix = `${summary}\n\n---\n\n`;
                  core.info('Generated AI release summary via OpenRouter');
                } catch (error) {
                  core.warning(`OpenRouter summary failed: ${error.message}`);
                }
              } else {
                core.info('OPENROUTER_API_KEY not set; baseline release notes already published');
              }

              const updatedBody = `${summaryPrefix}### Full Changelog\n\n${rawBody}\n\n---\n\n${containerSection}`;

              try {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.data.id,
                  body: updatedBody,
                });
                core.info(
                  `Updated release ${releaseTag} with changelog${summaryPrefix ? ' and AI summary' : ''}`,
                );
              } catch (error) {
                core.warning(`Failed to update release with AI summary: ${error.message}`);
                core.info('Baseline release notes were already published by the previous step.');
              }
            } catch (error) {
              core.warning(`Release AI summary step failed: ${error.message}`);
              core.info('Baseline release notes were already published by the previous step.');
            }
