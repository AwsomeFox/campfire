name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-container:
    name: Build and push container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/campfire" >> "$GITHUB_OUTPUT"

      - name: Stamp workspace package.json versions for the release tag
        run: |
          version="${{ steps.meta.outputs.version }}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json","apps/server/package.json","apps/web/package.json","packages/schema/package.json"]) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.version = v;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            }
            const docs = "website/docs/index.md";
            const md = fs.readFileSync(docs, "utf8");
            const next = md.replace(/current release is \*\*v[^*]+\*\*/, `current release is **v${v}**`);
            if (next === md) throw new Error("docs version marker missing");
            fs.writeFileSync(docs, next);
          ' "$version"
          node scripts/check-version-sync.mjs

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ steps.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Build release changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"

          # Find the previous release tag for the changelog range
          PREV_TAG=$(gh release list --limit 10 --json tagName,isPrerelease,isDraft \
            -q "[.[] | select(.tagName != \"${RELEASE_TAG}\" and .isPrerelease == false and .isDraft == false)] | .[0].tagName // empty")

          # Build the raw changelog body
          NOTES="## What's Changed"$'\n\n'

          if [ -n "$PREV_TAG" ]; then
            # Use GitHub's auto-generated notes API for a nice PR-based changelog
            API_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$RELEASE_TAG" \
              -f previous_tag_name="$PREV_TAG" \
              -q .body 2>/dev/null || true)

            if [ -n "$API_NOTES" ]; then
              NOTES="$API_NOTES"
            else
              # Fallback: simple commit log
              NOTES="${NOTES}$(git log "${PREV_TAG}..${RELEASE_TAG}" --pretty=format:'* %s (%h)' --no-merges)"$'\n'
            fi
          else
            NOTES="${NOTES}This is the first release."$'\n'
          fi

          printf '%s' "$NOTES" > "$RUNNER_TEMP/release-changelog.md"

          {
            echo '## Container image'
            echo ''
            echo '```'
            echo "docker pull ${IMAGE}"
            echo '```'
          } > "$RUNNER_TEMP/release-container.md"

      - name: Generate AI summary and update release
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: anthropic/claude-3.5-haiku
        with:
          script: |
            const fs = require('fs');
            const changelogPath = `${process.env.RUNNER_TEMP}/release-changelog.md`;
            const containerPath = `${process.env.RUNNER_TEMP}/release-container.md`;
            const rawBody = fs.readFileSync(changelogPath, 'utf8');
            const containerSection = fs.readFileSync(containerPath, 'utf8').trim();
            const releaseTag = process.env.GITHUB_REF_NAME;

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: releaseTag,
            });

            let summaryPrefix = '';

            if (process.env.OPENROUTER_API_KEY) {
              const prompt = `You are a technical product manager. Summarize these raw GitHub release notes into 3 clear sections:
            - 🚀 **Key Highlights**
            - ✨ **New Features & Improvements**
            - 🐛 **Bug Fixes & Maintenance**

            Keep it concise and clear. Here are the raw notes:
            ${rawBody}`;

              try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': `https://github.com/${context.repo.owner}/${context.repo.repo}`,
                    'X-Title': 'Campfire Release Summarizer',
                  },
                  body: JSON.stringify({
                    model: process.env.OPENROUTER_MODEL,
                    messages: [{ role: 'user', content: prompt }],
                  }),
                });

                const data = await response.json();

                if (!data.choices?.[0]?.message?.content) {
                  core.warning(`OpenRouter summary failed: ${JSON.stringify(data)}`);
                } else {
                  summaryPrefix = `${data.choices[0].message.content.trim()}\n\n---\n\n`;
                  core.info('Generated AI release summary via OpenRouter');
                }
              } catch (error) {
                core.warning(`OpenRouter summary failed: ${error.message}`);
              }
            } else {
              core.info('OPENROUTER_API_KEY not set; publishing changelog without AI summary');
            }

            const updatedBody = `${summaryPrefix}### Full Changelog\n\n${rawBody}\n\n---\n\n${containerSection}`;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: updatedBody,
            });

            core.info(`Updated release ${releaseTag} with changelog${summaryPrefix ? ' and AI summary' : ''}`);
