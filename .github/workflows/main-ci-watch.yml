name: Watch main CI

# Issue #1703: every automated and human process here is PR-scoped (sweeps
# enumerate open PRs, review bots comment on PRs, merge gating evaluates a
# PR's head sha). Nothing watches `main`'s OWN push-triggered CI runs, so a
# break that only shows up after merge — e.g. two individually-green PRs
# combining into a duplicate import (#1702) — produces a red run nobody is
# looking at. This workflow is the fix for the first checkbox only: poll the
# latest push-triggered CI workflow on a schedule, and surface a genuine failure
# where a human or agent will see it (a GitHub issue, created once and
# updated/closed rather than duplicated on every run).
#
# Deliberately out of scope here (left for separate work, see #1703):
#   - the `strict_required_status_checks_policy` ruleset change
#   - a duplicate-import guard
#
# Poll the latest push-triggered CI workflow run, rather than the latest main
# commit's check-runs. That preserves a failure when a later docs-only commit
# intentionally skips CI, and it naturally ignores a cancelled run once a newer
# run exists. Only an explicit `failure` opens or updates the tracking issue;
# queued, in-progress, cancelled, skipped, and neutral runs are not verdicts.
on:
  schedule:
    # Frequent enough that a break is caught within a working session.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: main-ci-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the tracking label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # `--force` makes this idempotent: creates the label on first run,
        # harmlessly re-applies the same color/description on every run after.
        run: |
          gh label create main-ci-broken --repo "$REPO" --force \
            --color b60205 \
            --description "Opened automatically when the latest main CI workflow fails"

      - name: Poll the latest main CI run and reconcile the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TRACKING_LABEL: main-ci-broken
        run: |
          set -euo pipefail

          ci_run=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0] // empty')

          if [ -z "$ci_run" ]; then
            echo "No push-triggered CI run exists for main yet — nothing to do."
            exit 0
          fi

          sha=$(echo "$ci_run" | jq -r '.head_sha // empty')
          status=$(echo "$ci_run" | jq -r '.status')
          conclusion=$(echo "$ci_run" | jq -r '.conclusion // empty')
          run_html_url=$(echo "$ci_run" | jq -r '.html_url // empty')
          if ! [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || [ -z "$run_html_url" ]; then
            echo "Latest CI run returned invalid metadata; refusing to reconcile issues." >&2
            exit 1
          fi
          echo "CI workflow status=${status} conclusion=${conclusion}"

          existing=$(gh issue list --repo "$REPO" --label "$TRACKING_LABEL" --state open \
            --json number --jq '.[0].number // empty')

          if [ "$status" != "completed" ]; then
            echo "ci is still ${status} on ${sha} — no verdict yet, not alerting."
            exit 0
          fi

          if [ "$conclusion" = "failure" ]; then
            body=$(printf '%s\n' \
              "CI failed on main's latest tested commit." \
              "" \
              "- Commit: ${sha}" \
              "- Workflow run: ${run_html_url}" \
              "- Commit: https://github.com/${REPO}/commit/${sha}" \
              "" \
              "This issue is maintained automatically by main-ci-watch.yml." \
              "It will close after a later push-triggered CI workflow succeeds." \
              "" \
              "<!-- main-ci-watch:last-failing-sha=${sha} -->")

            if [ -z "$existing" ]; then
              echo "Opening a new tracking issue for ${sha}."
              gh issue create --repo "$REPO" \
                --title "main CI is red (ci: failure at ${sha:0:10})" \
                --label "$TRACKING_LABEL" \
                --body "$body"
              exit 0
            fi

            # Idempotent update: only touch the issue if this is a NEW
            # failing commit since the last time we recorded one. Re-running
            # every 15 minutes against the same still-broken sha must not
            # post a fresh comment each time, or this gets muted within a
            # day exactly like the issue warns.
            last_recorded=$(gh issue view "$existing" --repo "$REPO" --json body \
              --jq '.body' | grep -o 'main-ci-watch:last-failing-sha=[0-9a-fA-F]*' | cut -d= -f2 || true)

            if [ "$last_recorded" = "$sha" ]; then
              echo "Issue #${existing} already tracks ${sha} — nothing to update."
              exit 0
            fi

            echo "Updating existing issue #${existing}: still red, now at ${sha}."
            gh issue edit "$existing" --repo "$REPO" --body "$body"
            exit 0
          fi

          # Only success resolves the tracking issue. Cancelled, skipped, and
          # neutral runs are ambiguous, so they leave any existing issue open.
          if [ -n "$existing" ] && [ "$conclusion" = "success" ]; then
            echo "ci is green on ${sha} — closing tracking issue #${existing}."
            gh issue close "$existing" --repo "$REPO" \
              --comment "CI is green again on ${sha} (${run_html_url}). Closing."
          else
            echo "Nothing to do (conclusion=${conclusion}, existing issue=${existing:-none})."
          fi
